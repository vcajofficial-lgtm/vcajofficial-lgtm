<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VCAJ | Official Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-background"></div>

        <section class="login-card">

            <!-- LOGO -->
            <div class="login-logo">
                <img
                    src="assets\logo\images\VCAJ.png"
                    alt="VCAJ Logo"
                >
            </div>

            <!-- BRAND -->
            <div class="login-brand">
                <h1>VCAJ</h1>

                <p>
                    VIVEKANANDA CRICKET ASSOCIATION
                    OF JELIAKHALI
                </p>
            </div>

            <!-- TITLE -->
            <div class="login-heading">

                <span>OFFICIAL ACCESS</span>

                <h2>Official Login</h2>

                <p>
                    Sign in to access VCAJ official management systems.
                </p>

            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Email Address
                    </label>

                    <div class="input-box">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="username"
                            name="username"
                            placeholder="Enter your email address"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">⌑</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>Remember me</span>

                    </label>

                    <a
                        href="#"
                        class="forgot-password"
                        id="forgotPassword"
                    >
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

            <!-- BACK -->
            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Public Website
            </a>

        </section>

    </main>

    <!-- FIREBASE LOGIN -->
    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
